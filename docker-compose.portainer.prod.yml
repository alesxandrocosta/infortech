version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: infortec-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPass123}
      MYSQL_DATABASE: ${DB_NAME:-bd_infortec}
      MYSQL_USER: ${DB_USER:-infortec_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-InFortec!2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    container_name: infortec-backend
    working_dir: /app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-infortec_app}
      DB_PASSWORD: ${DB_PASSWORD:-InFortec!2026}
      DB_NAME: ${DB_NAME:-bd_infortec}
      JWT_SECRET: ${JWT_SECRET:-troque-este-token-seguro}
      JWT_EXPIRY: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sistema.ajsouza.com.br}
      TZ: America/Sao_Paulo
    ports:
      - "5000:5000"
    volumes:
      - /opt/infortec/backend:/app
    command: >
      sh -c "npm install --include=dev && npm run init-db && npm run start"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: infortec-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://sistema1.ajsouza.com.br}
      VITE_APP_NAME: TechFlow ERP
    ports:
      - "4173:4173"
    volumes:
      - /opt/infortec/frontend:/app
    command: >
      sh -c "npm install --include=dev && npm run build && npm install -g serve && serve -s dist -l 4173"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: infortec-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
